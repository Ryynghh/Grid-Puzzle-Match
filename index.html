<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Crush</title>
    <link rel="stylesheet" href="fruit.css">
    <script src="fruit.js" defer></script>
</head>

<body>
    <header>
        <h1>Score: <span id="score">0</span></h1>
        <div class="info-container">
            <h2>Time: <span id="timer">60</span></h2>
            <h2>Moves: <span id="moves">30</span></h2>
        </div>
    </header>

    <button id="start-btn" class="btn">Start Game</button>

    <main class="game-container">
        <div id="board"></div>
        <h2 id="combo">Combo</h2>
    </main>

    <!-- POP-UP GAME OVER -->
    <div id="game-over-modal" class="modal modal-hidden">
        <div class="modal-content">
            <h2>Time's Up!</h2>
            <p>Your Final Score:</p>
            <h1 id="final-score">0</h1>
            <button id="modal-restart-btn" class="btn">Play Again</button>
        </div>
    </div>
</body>

</html>
